name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npm test
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect site changes
        id: site_changes
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          changed_files=$(git diff --name-only "$BEFORE" "$AFTER" -- \
            site/index.html \
            site/app.js \
            site/styles.css \
            scripts/write_build_info.sh \
            netlify.toml)
          if [[ -n "$changed_files" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node.js for deployment
        if: steps.site_changes.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies for deployment
        if: steps.site_changes.outputs.changed == 'true'
        run: npm ci
      - name: Generate build metadata
        if: steps.site_changes.outputs.changed == 'true'
        run: bash scripts/write_build_info.sh
        env:
          COMMIT_REF: ${{ github.sha }}
      - name: Deploy to production on Netlify
        if: steps.site_changes.outputs.changed == 'true'
        run: npx netlify deploy --dir=site --no-build --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}